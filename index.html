<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="js-widget-title" content="Art Docent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: black;
            color: white;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.9);
        }
        /* This container forces the wrapping you requested */
        .widget-container {
            max-width: 140px; 
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .days-until { color: #FF9F0A; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .date-line { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
        .lesson { font-weight: 800; font-size: 14px; color: #0A84FF; line-height: 1.1; }
        .details { font-size: 10px; opacity: 0.8; line-height: 1.2; }
        .partners { font-size: 10px; opacity: 0.6; font-style: italic; margin-top: 2px; line-height: 1.2; }
    </style>
</head>
<body>
    <div id="content" class="widget-container">Syncing...</div>

    <script>
// Tells the app to wait 5 seconds now, just to be safe
function __wweb2WaitMillisecondsToWidgetIsReady() { return 5000; }

async function fetchAndDisplay() {
    const container = document.getElementById('content');
    
    try {
        // STEP 1: Update text so we know the script started
        container.innerHTML = "1. Connecting...";

        const response = await fetch(SHEET_CSV_URL + "&t=" + Date.now());
        
        // STEP 2: We successfully talked to Google
        container.innerHTML = "2. Downloading...";
        
        if (!response.ok) throw new Error('Network error');
        const text = await response.text();
        
        // STEP 3: We got the data, now parsing
        container.innerHTML = "3. Reading Schedule...";

        const lines = text.split('\n');
        const rows = lines.map(line => parseCSVRow(line));
        const now = new Date();
        now.setHours(0,0,0,0);
        
        let nextSession = null;

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 2) continue;
            const sessionDate = new Date(row[1]);
            if (!isNaN(sessionDate.getTime()) && sessionDate >= now) {
                const teamList = [row[8], row[9], row[10]].filter(Boolean).join(", ");
                nextSession = {
                    date: sessionDate,
                    lesson: row[4] || "Art Lesson",
                    teacher: row[5] || "",
                    school: row[6] || "",
                    grade: row[7] || "",
                    team: teamList
                };
                break;
            }
        }

        if (nextSession) {
            const diffDays = Math.ceil((nextSession.date - now) / (1000 * 60 * 60 * 24));
            const dayLabel = diffDays === 0 ? "Today" : `in ${diffDays} days`;
            const dateStr = nextSession.date.toLocaleDateString('en-US', { 
                weekday: 'short', month: 'short', day: 'numeric' 
            });

            // SUCCESS: Show the final design
            container.innerHTML = `
                <div class="days-until">${dayLabel}</div>
                <div class="date-line">${dateStr}</div>
                <div class="lesson">${nextSession.lesson}</div>
                <div class="details">${nextSession.teacher} (Grade ${nextSession.grade}) @ ${nextSession.school}</div>
                <div class="partners">${nextSession.team}</div>
            `;
        } else {
            container.innerHTML = "No lessons found.";
        }
    } catch (e) {
        // If it fails, it will tell us it's an "Error"
        container.innerHTML = "Error: " + e.message;
    }
}

fetchAndDisplay();
    </script>
</body>
</html>
